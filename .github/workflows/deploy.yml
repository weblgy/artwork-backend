name: 后端自动部署 (Backend Deploy)

on:
  push:
    # ⚠️ 请确认你的分支名是 main 还是 master
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v3

      - name: 2. 设置 Java 环境
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17' # 你的 Java 版本 (如果你用 JDK 8 就写 '8')

      - name: 3. Maven 打包
        # -DskipTests 跳过测试，能快很多
        run: mvn clean package -DskipTests

      - name: 4. 上传 Jar 包到服务器
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          # Maven 打包后的 jar 包通常在 target 目录下
          source: "target/*.jar"
          # 上传到服务器的 jar 包存放目录
          target: "/www/jar/"
          # 去掉 target 这一层目录，直接把 .jar 放在 /www/jar/ 下
          strip_components: 1

      - name: 5. 重启 Java 服务
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: |
            echo "开始重启后端..."
            
            # 1. 查找并杀掉旧进程
            pid=$(ps -ef | grep artwork | grep -v grep | awk '{print $2}')
            if [ -n "$pid" ]; then
              kill -9 $pid
              echo "已停止旧进程: $pid"
            fi
            
            # 2. 启动新进程 (使用 prod 生产环境配置)
            # ⚠️ 注意：这里的文件名 artwork-0.0.1-SNAPSHOT.jar 必须跟你 pom.xml 生成的一致
            # 如果不确定，可以去 target 目录看一眼，或者直接用 *.jar 通配符(不推荐)
            nohup /www/server/java/jdk-17.0.8/bin/java -jar /www/jar/artwork-0.0.1-SNAPSHOT.jar \
  --spring.profiles.active=prod \
  --aliyun.oss.access-key-id=${{ secrets.ALIYUN_AK }} \
  --aliyun.oss.access-key-secret=${{ secrets.ALIYUN_SK }} \
  > /www/jar/app.log 2>&1 &
            echo "后端重启命令已发送！"