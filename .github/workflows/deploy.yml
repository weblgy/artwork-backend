name: 后端自动部署 (Backend Deploy)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v3

      - name: 2. 设置 Java 环境
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Maven 打包
        run: mvn clean package -DskipTests

      - name: 4. 上传 Jar 包到服务器
        uses: appleboy/scp-action@master
        with:
          # ⚠️ 注意：请确保 GitHub Settings -> Secrets 里也是叫 ALIYUN_HOST
          host: ${{ secrets.ALIYUN_HOST }}
          username: root
          password: ${{ secrets.ALIYUN_PASSWORD }}
          source: "target/*.jar"
          target: "/www/jar/"
          strip_components: 1

      - name: 5. 重启 Java 服务
        uses: appleboy/ssh-action@master
        with:
          # ⚠️ 这里也要用一样的变量名
          host: ${{ secrets.ALIYUN_HOST }}
          username: root
          password: ${{ secrets.ALIYUN_PASSWORD }}
          script: |
            echo "---------- 开始部署流程 ----------"
            
            # 1. 查找并杀掉旧进程 (更安全的写法)
            # 这里的 artwork 关键字要确保能匹配到你的 jar 包名
            pid=$(ps -ef | grep artwork | grep -v grep | awk '{print $2}')
            if [ -n "$pid" ]; then
              kill -9 $pid
              echo "✅ 已停止旧进程: $pid"
            else
              echo "ℹ️ 未发现运行中的旧进程"
            fi
            
            # 2. 等待几秒确保端口释放
            sleep 3
            
            # 3. 启动新进程 (使用绝对路径 java，并注入阿里云参数)
            # ⚠️ 注意：确保 jar 包名字 artwork-0.0.1-SNAPSHOT.jar 正确
            nohup /www/server/java/jdk-17.0.8/bin/java -jar /www/jar/artwork-0.0.1-SNAPSHOT.jar --spring.profiles.active=prod --aliyun.oss.access-key-id=${{ secrets.ALIYUN_AK }} --aliyun.oss.access-key-secret=${{ secrets.ALIYUN_SK }} > /www/jar/app.log 2>&1 &
            
            echo "✅ 后端重启命令已发送！"
            echo "---------------------------------"